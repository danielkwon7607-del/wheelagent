name: Wheel Bot

# Started by an outside timer, not GitHub's schedule. GitHub's cron ran
# hours late or not at all (Sep 2026), so a cron-job.org job calls this
# workflow's dispatch API every 15 min, 9:00-15:45 New York time, Mon-Fri
# (see setup_trigger.py). The bot's own is_market_hours() still decides
# whether to trade, so early or extra runs just log "Market closed".
on:
  # Also lets you trigger a run by hand from the Actions tab to test.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a run started while another is in progress waits for
# it, so two runs can never both see "no open orders" and both place one.
concurrency:
  group: wheel-bot
  cancel-in-progress: false

jobs:
  run-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # caches deps so each run installs in seconds

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wheel bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python wheel_bot.py
